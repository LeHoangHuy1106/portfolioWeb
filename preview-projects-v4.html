<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>BNA Dev v4 — Project page design preview</title><link rel="stylesheet" href="src/styles.css"/><style>
.preview-wrap{width:min(1400px,calc(100% - 40px));margin:0 auto;padding-bottom:50px}
.preview-header{display:flex;justify-content:space-between;align-items:center;padding:25px 0 20px;border-bottom:1px solid #383943}
.preview-header strong{font-size:27px}.preview-header small{font-size:12px;color:#a8a29d}.preview-buttons{display:flex;gap:8px}.preview-buttons button{border:1px solid #7f7971;border-radius:999px;background:transparent;padding:11px 18px}.preview-buttons button.active{background:#f0e6d7;color:#191a1f}
.preview-page{padding:35px 0 0}.preview-title{font-size:46px;letter-spacing:-.06em;margin:10px 0 8px}.preview-sub{color:#aaa6a2;margin:0 0 30px}
.preview-layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px}.preview-project-list{border:1px solid #4d4b4b;border-radius:14px;background:#202126;padding:24px;align-self:start;min-height:100px}.preview-project-list small{display:block;color:#aaa5a0;font-size:12px;margin-top:12px}
.preview-modal{position:fixed;inset:0;z-index:100;display:none;place-items:center;background:#000b;padding:20px}.preview-modal.active{display:grid}.preview-modal-inner{max-width:800px;width:100%;background:#18191e;border:1px solid #a69e94;border-radius:20px;padding:20px}.preview-modal-inner img{width:100%;border-radius:13px}.preview-modal-inner button{float:right;border:0;background:#fff0eb;color:#111;border-radius:12px;padding:5px 13px}
@media(max-width:900px){.preview-layout{grid-template-columns:1fr}.preview-project-list{display:none}.preview-title{font-size:37px}.preview-header strong{font-size:20px}.preview-wrap{width:calc(100% - 24px)}}
</style></head><body><div class="preview-wrap"><header class="preview-header"><strong>BNA Dev</strong><div class="preview-buttons"><button class="active" onclick="selectTab('featured')" id="bfeatured">GCF · Systems</button><button onclick="selectTab('archive')" id="barchive">Archive · Phone</button></div><small>STATIC DESIGN PREVIEW</small></header><main class="preview-page"><div class="eyebrow"><span class="eyebrow-line"></span>01 / SELECTED WORK</div><h1 class="preview-title">Dự án</h1><p class="preview-sub">Bản xem trước bố cục mới, không phải React app.</p><div class="preview-layout"><aside class="preview-project-list"><strong id="sidebar-title">Game Challenge Festival</strong><small id="sidebar-sub">Hệ sinh thái mini game · 2026</small></aside><div id="content"></div></div></main></div>
<div class="preview-modal" id="modal" onclick="closeModal()"><div class="preview-modal-inner" onclick="event.stopPropagation()"><button onclick="closeModal()">✕</button><img src="public/art/features/challenge.svg" id="modal-img" alt="Feature screenshot"/></div></div>
<script>
const features={challenge:'challenge',journey:'journey',mission:'mission',pets:'pets'};function openFeature(k){document.getElementById('modal-img').src='public/art/features/'+k+'.svg';document.getElementById('modal').classList.add('active')}function closeModal(){document.getElementById('modal').classList.remove('active')}window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
const gcf=`<div class="project-detail"><div class="project-display project-display-wide"><div class="project-poster"><div class="gcf-art"><div class="gcf-art-ring"></div><span class="gcf-art-symbol">✦</span><span class="gcf-art-label">Game Challenge Festival</span></div></div><div class="project-overview"><span class="overline">DỰ ÁN TRỌNG ĐIỂM · 2026</span><h2>Game Challenge Festival</h2><p class="project-category">Hệ sinh thái mini game</p><p class="project-description">Nền tảng game gồm mini game, phòng Challenge realtime, bản đồ hành trình, nhiệm vụ, kinh tế, xếp hạng và bộ sưu tập linh vật.</p><div class="project-meta"><span class="dot-status"></span><span>Đang phát triển</span></div><small class="stack-label">CÔNG NGHỆ</small><div class="tech-tags"><span>Cocos Creator</span><span>TypeScript</span><span>Unity WebGL</span><span>Django</span><span>WebSocket</span></div></div></div><section class="feature-gallery-section"><div class="feature-gallery-heading"><div><div class="eyebrow"><span class="eyebrow-line"></span>02 / IMPLEMENTED SYSTEMS</div><h3>Nội dung đã triển khai</h3><p>Bấm vào một hạng mục để xem ảnh và thông tin chi tiết.</p></div><span>06 / MODULES</span></div><div class="feature-gallery-grid"><button class="feature-card" onclick="openFeature('challenge')"><div class="feature-thumb"><img src="public/art/features/challenge.svg" alt="Challenge Rooms"/><span class="feature-number">01</span></div><div class="feature-caption"><span><strong>Challenge Rooms</strong><small>Phòng realtime, đồng bộ người chơi và trạng thái sẵn sàng.</small></span><span>↗</span></div></button><button class="feature-card" onclick="openFeature('journey')"><div class="feature-thumb"><img src="public/art/features/journey.svg" alt="Map &amp; Journey"/><span class="feature-number">02</span></div><div class="feature-caption"><span><strong>Map &amp; Journey</strong><small>Bản đồ các đảo, chặng nhiệm vụ và mở khóa vùng đất.</small></span><span>↗</span></div></button><button class="feature-card" onclick="openFeature('mission')"><div class="feature-thumb"><img src="public/art/features/mission.svg" alt="Missions &amp; Achievements"/><span class="feature-number">03</span></div><div class="feature-caption"><span><strong>Missions &amp; Achievements</strong><small>Tiến độ mục tiêu và phần thưởng theo ngày/tuần.</small></span><span>↗</span></div></button><button class="feature-card" onclick="openFeature('pets')"><div class="feature-thumb"><img src="public/art/features/pets.svg" alt="Pet Collection"/><span class="feature-number">04</span></div><div class="feature-caption"><span><strong>Pet Collection</strong><small>Linh vật, trứng và công thức triệu hồi.</small></span><span>↗</span></div></button></div></section></div>`;
const archived=`<div class="project-detail project-detail-phone"><div class="project-display project-display-phone"><div class="project-poster project-poster-phone"><div class="device-poster"><div class="device-aura"></div><div class="device-phone"><div class="device-buttons"></div><div class="device-screen"><img class="device-screenshot" src="public/art/device-preview.svg"/></div><div class="device-island"></div></div></div><div class="gallery-switch"><button>‹</button><span>1/9</span><button>›</button></div></div><div class="project-overview"><span class="overline">DỰ ÁN CŨ · ARCHIVE</span><h2>2 Player Games: Dog Cat Battle</h2><p class="project-category">Casual</p><p class="project-description">Bản demo hiển thị ảnh gameplay dọc <strong>vừa khung điện thoại</strong>. Sau khi khôi phục thư mục assets, ảnh thực tế sẽ tự xuất hiện mà không bị kéo giãn hay bắt người xem cuộn hết chiều dài ảnh.</p><div class="project-meta"><span class="dot-status"></span><span>Lưu trữ</span></div></div></div></div>`;
function selectTab(s){document.getElementById('content').innerHTML=s==='featured'?gcf:archived;document.getElementById('bfeatured').classList.toggle('active',s==='featured');document.getElementById('barchive').classList.toggle('active',s==='archive');document.getElementById('sidebar-title').textContent=s==='featured'?'Game Challenge Festival':'2 Player Games: Dog Cat Battle';document.getElementById('sidebar-sub').textContent=s==='featured'?'Hệ sinh thái mini game · 2026':'Archive · Screenshot dọc'}selectTab('featured');
</script></body></html>
